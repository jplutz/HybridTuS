spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/protus_hybrid
    username: protus
    password: changeMe
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.default_schema: app

  flyway:
    default-schema: app
    schemas: app
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true

llm:
  provider: anthropic
  api-key: ${ANTHROPIC_API_KEY:sk-ant-placeholder}
  model: claude-3-5-sonnet-20241022
  temperature: 0.0
  max-tokens: 2048
  timeout-ms: 10000

mastery:
  alpha: 0.4
  threshold: 0.7

api:
  token: local-dev-token-12345

rate-limit:
  mutating-requests: 60    # Per minute for POST/PUT/PATCH/DELETE
  llm-requests: 10          # Per minute for LLM endpoints
  generate-requests: 5      # Per minute for generation endpoints

logging:
  level:
    org.example.protushybrid: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
